name: Deploy to Dev Only

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Lint JavaScript Files
      - name: Lint JavaScript Files
        run: npm run lint

      # Step 5: Install Serverless Framework
      - name: Install Serverless Framework
        run: npm install -g serverless

      # Step 6: Configure AWS Profile
      - name: Configure AWS Profile
        run: |
          mkdir -p ~/.aws
          echo "[serverless]" > ~/.aws/credentials
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
        env:
          AWS_PROFILE: serverless

      # Step 7: Deploy to Serverless (dev stage)
      - name: Deploy to Serverless (dev stage)
        env:
          AWS_PROFILE: serverless
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: serverless deploy --stage dev
