# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: adeeltariqkhan
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: coffeeshop-serverless
# "service" is the name of this project. This will also be added to your AWS resource names.
service: coffeeshop-serverless


stages:
  default:
    params:
      tableName: "users-table-${sls:stage}"

provider:
  name: aws
  runtime: nodejs20.x
  profile: serverless
  environment:
    USERS_TABLE: ${self:custom.tablePrefix}-${opt:stage, 'dev'}  # Use a default stage if not provided
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: 
            - Fn::GetAtt: [UsersTableDev, Arn]  # For development
            - Fn::GetAtt: [UsersTableProd, Arn] # For production

custom:
  tablePrefix: UsersTable

functions:
  createUser:
    handler: handler.createUser
    events:
      - http:
          path: users
          method: post

  getUser:
    handler: handler.getUser
    events:
      - http:
          path: users/{userId}
          method: get

  updateUser:
    handler: handler.updateUser
    events:
      - http:
          path: users/{userId}
          method: put

  deleteUser:
    handler: handler.deleteUser
    events:
      - http:
          path: users/{userId}
          method: delete

resources:
  Resources:
    UsersTableDev:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablePrefix}-dev
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    UsersTableProd:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablePrefix}-prod
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
